<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="app-version" content="1.0.3">
    <script>
      if (!window.location.hostname.includes('localhost') && window.location.hostname !== '127.0.0.1' && !window.location.hostname.includes('pages.dev')) {
        document.write('<base href="/LAMOUR-Digital-Display-Board/">');
      }
    </script>
    <title>地段環境 - 富宇樂慕 LAMOUR</title>
    <!-- Favicon -->
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4A5759">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="富宇樂慕">
    <link rel="apple-touch-icon" href="assets/images/fuyu-logo.webp">
    <!-- CSS -->
    <link rel="stylesheet" href="css/variables.css?v=1.0.3">
    <link rel="stylesheet" href="css/global.css?v=1.0.3">
    <link rel="stylesheet" href="css/topbar.css?v=1.0.3">
    <!-- Pannellum 360 Viewer（本地版本） -->
    <link rel="stylesheet" href="assets/pannellum/pannellum.min.css">
    <link rel="stylesheet" href="css/location.css?v=1.0.4">
    <!-- PWA Update Loading Screen -->
    <style id="pwa-loading-style">
      #pwa-loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(135deg, #353F41 0%, #4A5759 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        opacity: 1;
        transition: opacity 0.5s ease-out;
      }
      #pwa-loading-overlay.hidden {
        pointer-events: none;
        opacity: 0;
      }
      .pwa-loading-content {
        text-align: center;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .pwa-loading-spinner {
        width: 60px;
        height: 60px;
        margin: 0 auto 20px;
        border: 3px solid rgba(255, 255, 255, 0.2);
        border-top-color: #EDAFB8;
        border-radius: 50%;
        animation: pwa-spin 1s linear infinite;
      }
      @keyframes pwa-spin {
        to { transform: rotate(360deg); }
      }
      .pwa-loading-text {
        font-size: 16px;
        font-weight: 500;
        color: #ccc;
      }
    </style>
</head>

<body class="pano-page">
    <!-- PWA Loading Overlay -->
    <div id="pwa-loading-overlay">
      <div class="pwa-loading-content">
        <div class="pwa-loading-spinner"></div>
        <div class="pwa-loading-text">正在檢查更新...</div>
      </div>
    </div>
    <!-- Top Bar (由 topbar.js 統一注入) -->
    <div id="topbar-root"></div>

    <!-- 360 全景檢視器 -->
    <div class="pano-wrapper">
        <div id="panorama"></div>
    </div>

    <!-- 操作提示（自動消失） -->
    <div class="loc-hint">
        <div class="loc-hint-icon">👆</div>
        <div class="loc-hint-text">拖曳畫面以環顧四周</div>
    </div>

    <!-- 頁面標題浮層 -->
    <div class="loc-title-overlay">
        <h2>地段環境</h2>
        <p>LOCATION & SURROUNDINGS</p>
    </div>

    <!-- POI Modal Dialog -->
    <div class="poi-modal-overlay" id="poiModal">
        <div class="poi-modal" style="position: relative;">
            <button class="poi-modal-close" id="poiModalClose">×</button>
            <img class="poi-modal-img" id="poiModalImg" src="" alt="">
            <div class="poi-modal-body">
                <h3 class="poi-modal-title" id="poiModalTitle"></h3>
                <div class="poi-modal-subtitle" id="poiModalSubtitle"></div>
                <p class="poi-modal-desc" id="poiModalDesc"></p>
            </div>
        </div>
    </div>

    <!-- JS -->
    <script src="js/topbar.js"></script>

    <script src="assets/pannellum/pannellum.min.js"></script>
    <script>
        // 延遲執行以確保 pannellum 已加載（SPA 導航時的備用方案）
        // 檢查是否已經定義，避免 SPA 導航時重複聲明
        if (!window.initLocationScript) {
            window.initLocationScript = () => {
            (() => {
            /* ===== 熱點資料定義 =====
             * 如何取得座標？將下方 hotSpotDebug 設為 true，
             * 然後在 360 畫面上點擊任意位置，流覽器 Console 會印出該點的 yaw 與 pitch 值。
             * 將數字填入以下陣列即可。
             *
             * w / h：熱點矩形的寬高（px，以 hfov=120 為基準，縮放時會自動等比調整），
             * 每個熱點可獨立調整；hotSpotDebug=true 時會顯示黃色矩形方便對位。
             */
            const hotspots = [

                {
                    id: 'station',
                    yaw: 84.3123,
                    pitch: -8.5591,
                    w: 30,
                    h: 120,
                    label: '新莊車站',
                    icon: '🚉',
                    title: '新莊車站',
                    subtitle: 'Xinzhuang Train Station',
                    image: 'assets/images/train-station.webp',
                    desc: '距離900公尺，開車3分鐘'
                },
                {
                    id: 'KHPark',
                    yaw: 62.9695,
                    pitch: -18.1887,
                    w: 30,
                    h: 120,
                    label: '關新公園',
                    icon: '🌳',
                    title: '關新公園',
                    subtitle: 'Guanxin Park',
                    image: 'assets/images/KHPark.webp',
                    desc: '距離550公尺，徒步8分鐘'
                },
                {
                    id: 'HSP',
                    yaw: -94.1862,
pitch:  -3.2282,
                    w: 180,
                    h: 30,
                    label: '竹科園區',
                    icon: '🏢',
                    title: '竹科園區',
                    subtitle: 'Hsinchu Science Park',
                    image: 'assets/images/HSP.webp',
                    desc: '距離1.6公里，開車5分鐘'
                },
                {
                    id: 'DECATHLON',
                    yaw: 37.2387,
pitch: -2.5432,
                    w: 30,
                    h: 120,
                    label: '迪卡儂',
                    icon: '🛒',
                    title: '迪卡儂',
                    subtitle: 'DECATHLON',
                    image: 'assets/images/DECATHLON.webp',
                    desc: '距離1公里，開車4分鐘'
                },
                {
                    id: 'COSTCO',
                    yaw: 41.8745,
pitch: -1.4868,
                    w: 30,
                    h: 120,
                    label: '好市多',
                    icon: '🛒',
                    title: '好市多',
                    subtitle: 'COSTCO',
                    image: 'assets/images/COSTCO.webp',
                    desc: '距離1.3公里，開車6分鐘'
                },
                {
                    id: 'Sun Yat-sen Freeway',
                    yaw: 12.9282,
pitch: 0.2215,
                    w: 30,
                    h: 120,
                    label: '國道一號',
                    icon: '🚗',
                    title: '國道一號',
                    subtitle: 'Sun Yat-sen Freeway',
                    image: 'assets/images/Sun Yat-sen Freeway.webp',
                    desc: '距離1.5公里，開車5分鐘'
                },
                {
                    id: 'NEHS',
                    yaw: -71.3245,
pitch: -14.5371,
                    w: 30,
                    h: 120,
                    label: '竹科實中',
                    icon: '🏫',
                    title: '竹科實中',
                    subtitle: 'National Experimental High School',
                    image: 'assets/images/NEHS.webp',
                    desc: '距離1公里，開車3分鐘'
                },
                {
                    id: 'LakePlacid',
                    yaw: -36.4871,
pitch: -10.7404,
                    w: 30,
                    h: 120,
                    label: '靜心湖',
                    icon: '💧',
                    title: '靜心湖',
                    subtitle: 'Lake Placid',
                    image: 'assets/images/Lake-Placid.webp',
                    desc: '距離1.1公里，徒步17分鐘'
                },

                /* ===== 以下 4 個點位自 panorama.html 同步新增 =====
                 * TODO: yaw / pitch 為暫定值，請用 debug 模式點擊 360 畫面取得實際座標後更新 */
                {
                    id: 'JinshanSt',
                    yaw: -134.6966,
pitch: -21.8529,
                    w: 150,
                    h: 30,
                    label: '金山街商圈',
                    icon: '🛒',
                    title: '金山街商圈',
                    subtitle: 'Jinshan Street Shopping District',
                    image: 'assets/images/jinshan-street.webp',
                    desc: '距離850公尺，開車3分鐘'
                },
                {
                    id: 'JinshanmianPark',
                    yaw: -157.6352,
pitch: -21.1390,
                    w: 30,
                    h: 150,
                    label: '金山面公園',
                    icon: '🌳',
                    title: '金山面公園',
                    subtitle: 'Jinshanmian Park',
                    image: 'assets/images/jinshanmian-park.webp',
                    desc: '距離900公尺，徒步13分鐘'
                },
                {
                    id: 'XinkeJH',
                    yaw: -171.4438,
pitch: -21.2152,
                    w: 30,
                    h: 120,
                    label: '新科國中',
                    icon: '🏫',
                    title: '新科國中',
                    subtitle: 'Xinke Junior High School',
                    image: 'assets/images/xinke-jh.webp',
                    desc: '距離850公尺，開車4分鐘'
                },
                {
                    id: 'GuandongES',
                   yaw: 98.3914,
pitch: -29.9865,
                    w: 30,
                    h: 120,
                    label: '關東國小',
                    icon: '🏫',
                    title: '關東國小',
                    subtitle: 'Guandong Elementary School',
                    image: 'assets/images/guandong-es.webp',
                    desc: '距離1公里，開車4分鐘'
                }

            ];

            // 是否開啟 debug 模式（true: 點擊畫面在前端浮層顯示 yaw/pitch 座標）
            const hotSpotDebug = true;

            // w / h 的基準視角：矩形在此 hfov 下等於設定的像素值，縮放時等比調整
            const BASE_HFOV = 120;

            // 自訂矩形熱點的 DOM 參照（縮放時要調整尺寸用）
            const hotspotEls = [];

            // 初始化 Pannellum
            const viewer = pannellum.viewer('panorama', {
                type: 'equirectangular',
                panorama: 'assets/images/360pano.webp',
                autoLoad: true,
                autoRotate: false,
                compass: false,
                showZoomCtrl: true,
                showFullscreenCtrl: false,
                mouseZoom: true,
                hfov: 120,
                minHfov: 50,
                maxHfov: 120,
                friction: 0.15,
                yaw: 2.6775067496532836,
                pitch: -32.9360348197727,
                hotSpotDebug: hotSpotDebug,
                // 自訂矩形熱點（參考 panorama.html）：
                // debug=true 顯示黃色矩形；debug=false 透明但仍可點擊、hover 顯示距離提示
                hotSpots: hotspots.map(hs => ({
                    id: hs.id,
                    pitch: hs.pitch,
                    yaw: hs.yaw,
                    cssClass: 'loc-hotspot' + (hotSpotDebug ? ' debug' : ''),
                    createTooltipFunc: (div) => {
                        div.style.width = hs.w + 'px';
                        div.style.height = hs.h + 'px';
                        div.setAttribute('data-desc', hs.desc);
                        if (hotSpotDebug) {
                            const tag = document.createElement('span');
                            tag.className = 'loc-hotspot-debug-tag';
                            tag.textContent = `${hs.label} ${hs.w}×${hs.h}`;
                            div.appendChild(tag);
                        }
                        hotspotEls.push({ div, hs });
                    },
                    clickHandlerFunc: () => openPoiModal(hs)
                }))
            });

            // 縮放時等比調整矩形尺寸，讓矩形貼齊全景圖上的地標文字
            function resizeHotspots() {
                const scale = Math.tan((BASE_HFOV / 2) * Math.PI / 180)
                    / Math.tan((viewer.getHfov() / 2) * Math.PI / 180);
                hotspotEls.forEach(({ div, hs }) => {
                    div.style.width = (hs.w * scale).toFixed(1) + 'px';
                    div.style.height = (hs.h * scale).toFixed(1) + 'px';
                });
            }
            viewer.on('load', resizeHotspots);
            viewer.on('zoomchange', resizeHotspots);

            // ===== Debug 座標浮層（點擊畫面即時顯示 yaw / pitch） =====
            if (hotSpotDebug) {
                const dbg = document.createElement('div');
                dbg.id = 'pnrmDebugPanel';
                dbg.style.cssText = [
                    'position:absolute', 'bottom:24px', 'left:12px', 'z-index:9999',
                    'background:rgba(0,0,0,0.8)', 'color:#ffe600', 'font:13px/1.6 monospace',
                    'padding:10px 14px', 'border:1px solid #ffe600', 'border-radius:8px',
                    'max-width:90vw', 'pointer-events:auto', 'user-select:text'
                ].join(';');
                dbg.innerHTML = '<div style="color:#fff;margin-bottom:4px">🐛 Debug：點擊畫面取得座標</div>'
                    + '<div id="pnrmDebugCoords">尚未取得</div>'
                    + '<button id="pnrmDebugCopy" style="margin-top:8px;padding:4px 10px;'
                    + 'background:#ffe600;color:#000;border:none;border-radius:4px;'
                    + 'cursor:pointer;font:12px monospace">複製座標</button>';
                document.getElementById('panorama').appendChild(dbg);

                const coordsEl = dbg.querySelector('#pnrmDebugCoords');
                const copyBtn = dbg.querySelector('#pnrmDebugCopy');
                let lastSnippet = '';

                const renderCoords = (e) => {
                    // 點在 debug 面板上（含複製按鈕）時忽略，避免覆蓋已取得的座標
                    if (e.target && dbg.contains(e.target)) return;
                    const c = viewer.mouseEventToCoords(e); // [pitch, yaw]
                    const pitch = c[0].toFixed(4);
                    const yaw = c[1].toFixed(4);
                    lastSnippet = `yaw: ${yaw},\npitch: ${pitch},`;
                    coordsEl.innerHTML = `yaw: <b>${yaw}</b><br>pitch: <b>${pitch}</b>`;
                    console.log(`[HotSpot Debug] yaw: ${yaw}, pitch: ${pitch}`);
                };

                // 用 mouseup 避免和拖曳衝突
                document.getElementById('panorama').addEventListener('mouseup', renderCoords);
                document.getElementById('panorama').addEventListener('touchend', (e) => {
                    if (e.changedTouches && e.changedTouches.length) renderCoords(e.changedTouches[0]);
                });

                copyBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (!lastSnippet) return;
                    navigator.clipboard?.writeText(lastSnippet);
                    copyBtn.textContent = '已複製 ✓';
                    setTimeout(() => { copyBtn.textContent = '複製座標'; }, 1200);
                });
            }

            // ===== Modal 控制 =====
            const modal = document.getElementById('poiModal');
            const modalImg = document.getElementById('poiModalImg');
            const modalTitle = document.getElementById('poiModalTitle');
            const modalSubtitle = document.getElementById('poiModalSubtitle');
            const modalDesc = document.getElementById('poiModalDesc');
            const modalClose = document.getElementById('poiModalClose');

            function openPoiModal(poi) {
                modalImg.src = poi.image;
                modalImg.alt = poi.title;
                modalTitle.textContent = poi.title;
                modalSubtitle.textContent = poi.subtitle;
                modalDesc.textContent = poi.desc;
                modal.classList.add('active');
            }

            function closePoiModal() {
                modal.classList.remove('active');
            }

            modalClose.addEventListener('click', closePoiModal);
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closePoiModal();
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closePoiModal();
            });
        })();
            };
        }

        // SPA 導航時 pannellum 可能延遲加載
        if (window.pannellum) {
            console.log('[Location] pannellum 已加載，初始化...');
            initLocationScript();
        } else {
            console.warn('[Location] pannellum 尚未加載，等待中...');
            let retries = 0;
            const maxRetries = 100; // 10 秒超時
            const waitPannellum = setInterval(() => {
                if (window.pannellum) {
                    clearInterval(waitPannellum);
                    console.log('[Location] pannellum 加載完成，初始化...');
                    initLocationScript();
                } else if (++retries > maxRetries) {
                    clearInterval(waitPannellum);
                    console.error('[Location] pannellum 加載超時（10秒）');
                }
            }, 100);
        }
    </script>
    <script src="js/cursor-petals.js?v=1.0.3"></script>
    <script src="js/spa-router.js?v=1.0.2"></script>
    <!-- Asset Update Manager -->
    <script src="js/asset-update-manager.js"></script>
    <script src="js/pwa-register.js?v=1.0.2" defer></script>
</body>

</html>
