<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="app-version" content="1.0.4">
    <script>
      if (!window.location.hostname.includes('localhost') && window.location.hostname !== '127.0.0.1' && !window.location.hostname.includes('pages.dev')) {
        document.write('<base href="/LAMOUR-Digital-Display-Board/">');
      }
    </script>
    <title>全景 - 富宇樂慕 LAMOUR</title>
    <!-- Favicon -->
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4A5759">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="富宇樂慕">
    <link rel="apple-touch-icon" href="assets/images/fuyu-logo.webp">
    <!-- CSS -->
    <link rel="stylesheet" href="css/variables.css?v=1.0.3">
    <link rel="stylesheet" href="css/global.css?v=1.0.3">
    <link rel="stylesheet" href="css/topbar.css?v=1.0.3">

    <link rel="stylesheet" href="css/panorama.css?v=1.0.5">
    <!-- PWA Update Loading Screen -->
    <style id="pwa-loading-style">
      #pwa-loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(135deg, #353F41 0%, #4A5759 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        opacity: 1;
        transition: opacity 0.5s ease-out;
      }
      #pwa-loading-overlay.hidden {
        pointer-events: none;
        opacity: 0;
      }
      .pwa-loading-content {
        text-align: center;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .pwa-loading-spinner {
        width: 60px;
        height: 60px;
        margin: 0 auto 20px;
        border: 3px solid rgba(255, 255, 255, 0.2);
        border-top-color: #EDAFB8;
        border-radius: 50%;
        animation: pwa-spin 1s linear infinite;
      }
      @keyframes pwa-spin {
        to { transform: rotate(360deg); }
      }
      .pwa-loading-text {
        font-size: 16px;
        font-weight: 500;
        color: #ccc;
      }
    </style>
</head>

<body class="pano-page">
    <!-- PWA Loading Overlay -->
    <div id="pwa-loading-overlay">
      <div class="pwa-loading-content">
        <div class="pwa-loading-spinner"></div>
        <div class="pwa-loading-text">正在檢查更新...</div>
      </div>
    </div>
    <!-- Top Bar (由 topbar.js 統一注入) -->
    <div id="topbar-root"></div>

    <!-- 廣角全景區塊 -->
    <div class="pano-wrapper" id="panoWrapper">
        <img src="assets/images/location.webp" alt="全景" class="pano-image-target" id="panoImage">
    </div>

    <!-- POI Modal Dialog -->
    <div class="pnrm-modal-overlay" id="poiModal">
        <div class="pnrm-modal" style="position: relative;">
            <button class="pnrm-modal-close" id="poiModalClose">×</button>
            <div class="pnrm-modal-media">
                <img class="pnrm-modal-img" id="poiModalImg" src="" alt="">
                <button class="pnrm-slide-nav prev" id="poiSlidePrev" aria-label="上一張">&#10094;</button>
                <button class="pnrm-slide-nav next" id="poiSlideNext" aria-label="下一張">&#10095;</button>
            </div>
            <div class="pnrm-modal-dots" id="poiModalDots"></div>
            <div class="pnrm-modal-body">
                <h3 class="pnrm-modal-title" id="poiModalTitle"></h3>
                <div class="pnrm-modal-subtitle" id="poiModalSubtitle"></div>
                <p class="pnrm-modal-desc" id="poiModalDesc"></p>
            </div>
        </div>
    </div>

    <!-- 操作提示（自動消失） -->
    <div class="pnrm-hint">
        <div class="pnrm-hint-icon">🖱️</div>
        <div class="pnrm-hint-text">拖曳移動，滾輪縮放照片</div>
    </div>

    <!-- 頁面標題浮層 -->
    <div class="pnrm-title-overlay">
        <h2>全景</h2>
        <p>PANORAMA</p>
    </div>

    <!-- JS -->
    <script src="js/topbar.js"></script>
    <script>
        (() => {
            const container = document.getElementById('panoWrapper');
            const img = document.getElementById('panoImage');

            let scale = 1;
            let translateX = 0;
            let translateY = 0;

            let isDragging = false;
            let startClientX = 0;
            let startClientY = 0;
            let isDraggingWalk = 0;

            // ===== 熱點設定 (Hotspots) =====
            // 是否開啟 debug 模式 (true: 顯示黃色半透明背景與邊框並顯示點擊座標 / false: 透明可點擊區域)
            const hotSpotDebug = false;

            const hotspots = [
                {
                    id: 'HSP', x: 13.31, y: 29.00, w: 1.0, h: 14.5,
                    label: '竹科園區', title: '竹科園區', subtitle: 'Hsinchu Science Park',
                    image: 'assets/images/HSP.webp', desc: '距離1.6公里，開車5分鐘'
                },
                {
                    id: 'NEHS', x: 27.81, y: 29.00, w: 1.0, h: 14.5,
                    label: '竹科實中', title: '竹科實中', subtitle: 'National Experimental High School',
                    image: 'assets/images/NEHS.webp', desc: '距離1公里，開車3分鐘'
                },
                {
                    id: 'JinshanSt', x: 32.2, y: 29.00, w: 1.0, h: 14.5,
                    label: '金山街商圈', title: '金山街商圈', subtitle: 'Jinshan Street Shopping District',
                    image: 'assets/images/jinshan-street.webp', desc: '距離850公尺，開車3分鐘'
                },
                {
                    id: 'LakePlacid', x: 36.89, y: 29.00, w: 1.0, h: 14.5,
                    label: '靜心湖', title: '靜心湖', subtitle: 'Lake Placid',
                    image: 'assets/images/Lake-Placid.webp', desc: '距離1.1公里，徒步17分鐘'
                },
                {
                    // 文字較高（含「(規劃中)」），故 y / h 與其他熱點不同
                    id: 'KCIS', x: 53.02, y: 25.10, w: 1.0, h: 20.0,
                    label: '康橋國際學校', title: '康橋國際學校（規劃中）', subtitle: 'Kang Chiao International School',
                    image: 'assets/images/KCIS.webp', desc: '距離350公尺，徒步5分鐘'
                },
                {
                    id: 'JinshanmianPark', x: 55.57, y: 29.00, w: 1.0, h: 14.5,
                    label: '金山面公園', title: '金山面公園', subtitle: 'Jinshanmian Park',
                    image: 'assets/images/jinshanmian-park.webp', desc: '距離900公尺，徒步13分鐘'
                },
                {
                    id: 'GuanpuDistrict', x: 60.47, y: 29.00, w: 1.0, h: 14.5,
                    label: '關埔商圈', title: '關埔商圈', subtitle: 'Guanpu Shopping District',
                    image: 'assets/images/Starbucks.webp',
                    images: [
                        'assets/images/Starbucks.webp',
                        'assets/images/DECATHLON.webp',
                        'assets/images/COSTCO.webp'
                    ],
                    desc: '距離1.6公里，開車8分鐘'
                },
                {
                    id: 'XinkeJH', x: 65.99, y: 29.00, w: 1.0, h: 14.5,
                    label: '新科國中', title: '新科國中', subtitle: 'Xinke Junior High School',
                    image: 'assets/images/xinke-jh.webp', desc: '距離850公尺，開車4分鐘'
                },
                {
                    id: 'GuandongES', x: 68.81, y: 29.00, w: 1.0, h: 14.5,
                    label: '關東國小', title: '關東國小', subtitle: 'Guandong Elementary School',
                    image: 'assets/images/guandong-es.webp', desc: '距離1公里，開車4分鐘'
                },
                {
                    id: 'station', x: 72.28, y: 29.00, w: 1.0, h: 14.5,
                    label: '新莊車站', title: '新莊車站', subtitle: 'Xinzhuang Train Station',
                    image: 'assets/images/train-station.webp', desc: '距離900公尺，開車3分鐘'
                }
            ];

            const hotspotEls = [];
            hotspots.forEach(hs => {
                const el = document.createElement('div');
                el.className = 'pnrm-hotspot' + (hotSpotDebug ? ' debug' : '');
                // 改用自訂 data-desc 來觸發 CSS ::after Tooltip
                el.setAttribute('data-desc', hs.desc);
                el._hsData = hs;
                el.addEventListener('click', (e) => {
                    if (isDraggingWalk > 5) return;
                    e.stopPropagation();
                    openPoiModal(hs);
                });
                container.appendChild(el);
                hotspotEls.push(el);
            });

            if (img.complete) setTimeout(updateTransform, 50);
            img.addEventListener('load', () => updateTransform());

            // 限制縮放比例
            const MIN_SCALE = 1;
            const MAX_SCALE = 10;

            // 限制拖曳範圍
            function restrictTranslation() {
                // img 的原始大小 (scale=1 時)
                const imgW = img.offsetWidth;
                const imgH = img.offsetHeight;

                // 容器的大小
                const containerW = container.clientWidth;
                const containerH = container.clientHeight;

                // 放大後的影像在畫面上的實際寬高
                const scaledImgW = imgW * scale;
                const scaledImgH = imgH * scale;

                // 計算可移動的最大位移
                let maxTx = 0;
                let maxTy = 0;

                if (scaledImgW > containerW) {
                    maxTx = (scaledImgW - containerW) / 2;
                }

                if (scaledImgH > containerH) {
                    maxTy = (scaledImgH - containerH) / 2;
                }

                // 限制範圍
                if (translateX > maxTx) translateX = maxTx;
                if (translateX < -maxTx) translateX = -maxTx;

                if (translateY > maxTy) translateY = maxTy;
                if (translateY < -maxTy) translateY = -maxTy;
            }

            // 更新變形
            function updateTransform() {
                // 如果縮放回 1，則將位置歸零，實現「完整全部呈現水平垂直置中」
                if (scale === 1) {
                    translateX = 0;
                    translateY = 0;
                } else {
                    restrictTranslation();
                }
                img.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;

                // 同步計算並定位所有熱點
                if (img.naturalWidth) {
                    const imgAR = img.naturalWidth / img.naturalHeight;
                    const conAR = container.clientWidth / container.clientHeight;
                    let actualW, actualH;
                    if (imgAR > conAR) {
                        actualW = container.clientWidth;
                        actualH = actualW / imgAR;
                    } else {
                        actualH = container.clientHeight;
                        actualW = actualH * imgAR;
                    }

                    const centerX = container.clientWidth / 2;
                    const centerY = container.clientHeight / 2;

                    hotspotEls.forEach(el => {
                        const hs = el._hsData;
                        const offsetX = (hs.x / 100 - 0.5) * actualW;
                        const offsetY = (hs.y / 100 - 0.5) * actualH;

                        const finalX = centerX + offsetX * scale + translateX;
                        const finalY = centerY + offsetY * scale + translateY;

                        const finalW = (hs.w / 100) * actualW * scale;
                        const finalH = (hs.h / 100) * actualH * scale;

                        el.style.left = (finalX - finalW / 2) + 'px';
                        el.style.top = (finalY - finalH / 2) + 'px';
                        el.style.width = finalW + 'px';
                        el.style.height = finalH + 'px';
                    });
                }
            }

            // --- 拖曳事件 ---
            container.addEventListener('mousedown', (e) => {
                isDragging = true;
                isDraggingWalk = 0;
                startClientX = e.clientX;
                startClientY = e.clientY;
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;

                const deltaX = e.clientX - startClientX;
                const deltaY = e.clientY - startClientY;
                isDraggingWalk += Math.abs(deltaX) + Math.abs(deltaY);

                // transform: translate(tx) scale(s)
                // translate 位於前方，代表移動是以螢幕像素為單位
                translateX += deltaX;
                translateY += deltaY;

                startClientX = e.clientX;
                startClientY = e.clientY;

                updateTransform();
            });

            window.addEventListener('mouseup', () => {
                isDragging = false;
            });

            // --- 滾輪縮放事件 ---
            container.addEventListener('wheel', (e) => {
                e.preventDefault(); // 阻止頁面捲動

                const zoomIntensity = 0.1;
                const wheelDirection = e.deltaY < 0 ? 1 : -1;
                let newScale = scale * Math.exp(wheelDirection * zoomIntensity);

                // 限制區間
                if (newScale < MIN_SCALE) newScale = MIN_SCALE;
                if (newScale > MAX_SCALE) newScale = MAX_SCALE;

                // 游標距離中心點的螢幕偏移量
                // 我們希望縮放後，滑鼠所在點的實際位置保持不變
                // 公式： dx = mouseX_from_center
                // 新的 translateX 應該向游標的方向偏移，使得影像被放大時向游標靠攏
                const rect = container.getBoundingClientRect();
                const mouseX = e.clientX - rect.left - rect.width / 2;
                const mouseY = e.clientY - rect.top - rect.height / 2;

                // 計算差值
                const ratio = 1 - (newScale / scale);

                translateX += (mouseX - translateX) * ratio;
                translateY += (mouseY - translateY) * ratio;

                scale = newScale;
                updateTransform();
            }, { passive: false });

            // 雙擊還原
            container.addEventListener('dblclick', () => {
                scale = 1;
                translateX = 0;
                translateY = 0;
                updateTransform();
            });

            // Debug 點擊取得座標
            container.addEventListener('click', (e) => {
                if (isDraggingWalk > 5 || !hotSpotDebug) return;

                if (!img.naturalWidth) return;
                const imgAR = img.naturalWidth / img.naturalHeight;
                const conAR = container.clientWidth / container.clientHeight;
                let actualW, actualH;
                if (imgAR > conAR) {
                    actualW = container.clientWidth;
                    actualH = actualW / imgAR;
                } else {
                    actualH = container.clientHeight;
                    actualW = actualH * imgAR;
                }
                const centerX = container.clientWidth / 2;
                const centerY = container.clientHeight / 2;

                const offsetX = (e.clientX - centerX - translateX) / scale;
                const offsetY = (e.clientY - centerY - translateY) / scale;

                const pctX = (offsetX / actualW + 0.5) * 100;
                const pctY = (offsetY / actualH + 0.5) * 100;

                console.log(`[HotSpot Debug] x: ${pctX.toFixed(2)}, y: ${pctY.toFixed(2)} | Code: { id: 'new', x: ${pctX.toFixed(2)}, y: ${pctY.toFixed(2)}, w: 1.0, h: 14.5 }`);
                alert(`座標取得：\nx = ${pctX.toFixed(2)}%\ny = ${pctY.toFixed(2)}%`);
            });

            // ===== Modal 控制 =====
            const modal = document.getElementById('poiModal');
            const modalImg = document.getElementById('poiModalImg');
            const modalTitle = document.getElementById('poiModalTitle');
            const modalSubtitle = document.getElementById('poiModalSubtitle');
            const modalDesc = document.getElementById('poiModalDesc');
            const modalClose = document.getElementById('poiModalClose');
            const modalMedia = modal.querySelector('.pnrm-modal-media');
            const modalCard = modal.querySelector('.pnrm-modal');

            // ===== 圖片缺失處理：載入失敗時隱藏圖片區塊，不顯示瀏覽器破圖圖示 =====
            // 無圖時彈窗只剩文字，需一併切換 .no-media；否則關閉鈕（相對彈窗定位）會壓到標題
            function toggleMedia(visible) {
                modalMedia.style.display = visible ? '' : 'none';
                modalCard.classList.toggle('no-media', !visible);
            }

            modalImg.addEventListener('error', () => toggleMedia(false));

            function setModalImage(src) {
                if (!src) {
                    toggleMedia(false);
                    modalImg.removeAttribute('src');
                    return;
                }
                toggleMedia(true);
                modalImg.src = src;
            }

            // ===== 多圖手動輪播（hotspot 有 images 陣列時自動啟用） =====
            const modalDots = document.getElementById('poiModalDots');
            const slidePrev = document.getElementById('poiSlidePrev');
            const slideNext = document.getElementById('poiSlideNext');
            let slideImages = [];
            let slideIndex = 0;

            function showSlide(i) {
                slideIndex = (i + slideImages.length) % slideImages.length;
                modalImg.style.opacity = '0';
                setTimeout(() => {
                    setModalImage(slideImages[slideIndex]);
                    modalImg.style.opacity = '1';
                }, 200);
                Array.from(modalDots.children).forEach((d, j) => {
                    d.classList.toggle('active', j === slideIndex);
                });
            }

            slidePrev.addEventListener('click', (e) => {
                e.stopPropagation();
                showSlide(slideIndex - 1);
            });
            slideNext.addEventListener('click', (e) => {
                e.stopPropagation();
                showSlide(slideIndex + 1);
            });

            function openPoiModal(poi) {
                slideImages = (poi.images || [poi.image]).filter(Boolean);
                slideIndex = 0;
                setModalImage(slideImages[0]);
                modalImg.style.opacity = '1';
                modalImg.alt = poi.title;

                // 單圖隱藏切換 UI，多圖顯示左右箭頭與圓點
                const multi = slideImages.length > 1;
                slidePrev.style.display = multi ? '' : 'none';
                slideNext.style.display = multi ? '' : 'none';

                modalDots.innerHTML = '';
                if (multi) {
                    slideImages.forEach((_, i) => {
                        const dot = document.createElement('span');
                        dot.className = 'pnrm-modal-dot' + (i === 0 ? ' active' : '');
                        dot.addEventListener('click', () => showSlide(i));
                        modalDots.appendChild(dot);
                    });
                }

                modalTitle.textContent = poi.title;
                modalSubtitle.textContent = poi.subtitle;
                modalDesc.textContent = poi.desc;
                modal.classList.add('active');
            }

            function closePoiModal() {
                modal.classList.remove('active');
            }

            modalClose.addEventListener('click', closePoiModal);
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closePoiModal();
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closePoiModal();
                // 彈窗開啟且為多圖時，方向鍵也能切換
                if (modal.classList.contains('active') && slideImages.length > 1) {
                    if (e.key === 'ArrowLeft') showSlide(slideIndex - 1);
                    if (e.key === 'ArrowRight') showSlide(slideIndex + 1);
                }
            });

        })();
    </script>
    <!-- Asset Update Manager -->
    <script src="js/cursor-petals.js?v=1.0.3"></script>
    <script src="js/asset-update-manager.js"></script>
    <script src="js/pwa-register.js?v=1.0.2" defer></script>
</body>

</html>
