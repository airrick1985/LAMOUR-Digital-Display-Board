<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="app-version" content="1.0.4">
    <script>
      if (!window.location.hostname.includes('localhost') && window.location.hostname !== '127.0.0.1' && !window.location.hostname.includes('pages.dev')) {
        document.write('<base href="/LAMOUR-Digital-Display-Board/">');
      }
    </script>
    <title>外觀3D - 富宇樂慕 LAMOUR</title>
    <!-- Favicon -->
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4A5759">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="富宇樂慕">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
    <!-- CSS -->
    <link rel="stylesheet" href="css/variables.css?v=1.0.3">
    <link rel="stylesheet" href="css/global.css?v=1.0.3">
    <link rel="stylesheet" href="css/topbar.css?v=1.0.3">
    <link rel="stylesheet" href="css/exterior-3d.css?v=1.0.6">
    <!-- PWA Update Loading Screen -->
    <style id="pwa-loading-style">
      #pwa-loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(135deg, #353F41 0%, #4A5759 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        opacity: 1;
        transition: opacity 0.5s ease-out;
      }
      #pwa-loading-overlay.hidden {
        pointer-events: none;
        opacity: 0;
      }
      .pwa-loading-content {
        text-align: center;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .pwa-loading-spinner {
        width: 60px;
        height: 60px;
        margin: 0 auto 20px;
        border: 3px solid rgba(255, 255, 255, 0.2);
        border-top-color: #EDAFB8;
        border-radius: 50%;
        animation: pwa-spin 1s linear infinite;
      }
      @keyframes pwa-spin {
        to { transform: rotate(360deg); }
      }
      .pwa-loading-text {
        font-size: 16px;
        font-weight: 500;
        color: #ccc;
      }
    </style>
</head>

<body class="pano-page">
    <!-- PWA Loading Overlay -->
    <div id="pwa-loading-overlay">
      <div class="pwa-loading-content">
        <div class="pwa-loading-spinner"></div>
        <div class="pwa-loading-text">正在檢查更新...</div>
      </div>
    </div>
    <!-- Top Bar (由 topbar.js 統一注入) -->
    <div id="topbar-root"></div>

    <!-- 全螢幕圖片檢視器 -->
    <div class="ext3d-viewer" id="ext3dViewer">

        <!-- 圖片輪播 -->
        <div class="ext3d-slide active" data-index="0" id="dayNightSlide">
            <img class="ext3d-day-layer" src="assets/images/3D-01.webp" alt="富宇樂慕 外觀3D透視圖 - 日景" draggable="false">
            <img class="ext3d-night-layer" src="assets/images/3D-01-night.webp" alt="富宇樂慕 外觀3D透視圖 - 夜景" draggable="false">
        </div>

        <!-- 左右箭頭 -->
        <button class="ext3d-arrow ext3d-arrow-prev" id="prevBtn" title="上一張">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </button>
        <button class="ext3d-arrow ext3d-arrow-next" id="nextBtn" title="下一張">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
        </button>

        <!-- 底部導航 -->
        <div class="ext3d-bottom-bar">
            <div class="ext3d-dots" id="ext3dDots"></div>
        </div>

        <!-- 底部外觀介紹文字（日／夜景不同版本；黑色漸層透明底、白字） -->
        <div class="ext3d-intro" id="ext3dIntro">
            <div class="ext3d-intro-stack">
                <article class="ext3d-intro-text is-day">
                    <span class="ext3d-intro-eyebrow">日景 · DAYLIGHT</span>
                    <h3>日光 典雅立面</h3>
                    <p>優雅風範勾勒的建築量體，石材與線板層層堆疊，於日光下顯現溫潤質感與細膩比例；退縮綠廊與挑高門廳，讓每一次歸家都從容而優雅。</p>
                </article>
                <article class="ext3d-intro-text is-night">
                    <span class="ext3d-intro-eyebrow">夜景 · NIGHT VIEW</span>
                    <h3>夜幕 暖光流動</h3>
                    <p>暮色低垂，暖光自窗櫺與門廳緩緩漫溢，勾勒建築優雅輪廓；光影如香檳流轉，為城市夜色譜寫一場靜謐而浪漫的歸家序曲。</p>
                </article>
            </div>
        </div>

        <!-- 頁面標題 -->
        <div class="ext3d-title-overlay">
            <h2>外觀3D</h2>
            <p>EXTERIOR 3D RENDERING</p>
        </div>

        <!-- 日夜景切換 -->
        <div class="ext3d-daynight" id="dayNightToggle">
            <button class="dn-option day active" id="dnDay" aria-label="日景">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <circle cx="12" cy="12" r="4"></circle>
                    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
                </svg>
                <span>日景</span>
            </button>
            <button class="dn-option night" id="dnNight" aria-label="夜景">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
                <span>夜景</span>
            </button>
        </div>

        <!-- 計數器 -->
        <div class="ext3d-counter" id="ext3dCounter">1 / 1</div>

        <!-- 3D透視圖免責聲明 -->
        <div class="ext3d-disclaimer">本3D透視圖僅供參考，實際以建造變更核准圖面為準。</div>

        <!-- 操作提示 -->
        <div class="ext3d-hint">
            <span>提示</span>
            <span>滾輪縮放 · 拖曳移動 · 左右箭頭切換</span>
        </div>

    </div>

    <!-- JS -->
    <script src="js/topbar.js"></script>
    <script>
        (() => {
            const viewer = document.getElementById('ext3dViewer');
            const slides = viewer.querySelectorAll('.ext3d-slide');
            const dotsContainer = document.getElementById('ext3dDots');
            const counter = document.getElementById('ext3dCounter');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const totalSlides = slides.length;

            let currentIndex = 0;

            // ===== 建立圓點導航 =====
            slides.forEach((_, i) => {
                const dot = document.createElement('div');
                dot.className = 'ext3d-dot' + (i === 0 ? ' active' : '');
                dot.addEventListener('click', () => goToSlide(i));
                dotsContainer.appendChild(dot);
            });

            function goToSlide(index) {
                // 切換圖片前，先重設目前圖片的縮放狀態
                resetSlideTransform(currentIndex);

                slides[currentIndex].classList.remove('active');
                dotsContainer.children[currentIndex].classList.remove('active');

                currentIndex = (index + totalSlides) % totalSlides;

                // 重新觸發 Ken Burns 動畫（移除 interacting 並重啟 active 動畫）
                const nextSlide = slides[currentIndex];
                nextSlide.classList.remove('interacting', 'active');
                void nextSlide.offsetWidth; // 強制 reflow 讓動畫重頭播放
                nextSlide.classList.add('active');
                dotsContainer.children[currentIndex].classList.add('active');
                counter.textContent = `${currentIndex + 1} / ${totalSlides}`;

                // 只有第一張（有日夜景圖層）顯示切換按鈕與外觀介紹文字
                dayNightToggle.style.display = currentIndex === 0 ? 'flex' : 'none';
                if (ext3dIntro) ext3dIntro.style.display = currentIndex === 0 ? 'block' : 'none';

                // 確保新圖片的縮放也已重設
                resetSlideTransform(currentIndex);
            }

            prevBtn.addEventListener('click', () => goToSlide(currentIndex - 1));
            nextBtn.addEventListener('click', () => goToSlide(currentIndex + 1));

            // 只有一張圖時隱藏切換 UI（箭頭、圓點、計數器）
            if (totalSlides <= 1) {
                prevBtn.style.display = 'none';
                nextBtn.style.display = 'none';
                dotsContainer.style.display = 'none';
                counter.style.display = 'none';
                const hintText = document.querySelector('.ext3d-hint span:last-child');
                if (hintText) hintText.textContent = '滾輪縮放 · 拖曳移動';
            }

            // ===== 鍵盤左右箭頭 =====
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') goToSlide(currentIndex - 1);
                if (e.key === 'ArrowRight') goToSlide(currentIndex + 1);
            });

            // ===== 日夜景切換 =====
            const dayNightToggle = document.getElementById('dayNightToggle');
            const dayNightSlide = document.getElementById('dayNightSlide');
            const dnDay = document.getElementById('dnDay');
            const dnNight = document.getElementById('dnNight');
            const ext3dIntro = document.getElementById('ext3dIntro');

            let dnSwitchTimer = null;
            function setNightMode(on) {
                // 已是目標狀態就不重播轉場，避免重複點擊閃爍
                if (dayNightSlide.classList.contains('night') === on) return;

                dayNightSlide.classList.toggle('night', on);
                dnDay.classList.toggle('active', !on);
                dnNight.classList.toggle('active', on);
                if (ext3dIntro) ext3dIntro.classList.toggle('night', on); // 同步切換介紹文字版本

                // 觸發暮色「漸出→漸入」轉場：移除後強制 reflow 讓動畫重頭播放
                dayNightSlide.classList.remove('switching');
                void dayNightSlide.offsetWidth;
                dayNightSlide.classList.add('switching');
                clearTimeout(dnSwitchTimer);
                dnSwitchTimer = setTimeout(() => {
                    dayNightSlide.classList.remove('switching');
                }, 1100);
            }

            dnDay.addEventListener('click', () => setNightMode(false));
            dnNight.addEventListener('click', () => setNightMode(true));

            // ===== 每張圖片獨立的縮放/拖曳 =====
            const slideStates = Array.from(slides).map(() => ({
                scale: 1, translateX: 0, translateY: 0
            }));
            const MIN_SCALE = 1;
            const MAX_SCALE = 8;

            let isDragging = false;
            let startX = 0, startY = 0;

            function updateSlideTransform(index) {
                const s = slideStates[index];
                const img = slides[index].querySelector('img');
                if (s.scale <= 1) {
                    s.scale = 1;
                    s.translateX = 0;
                    s.translateY = 0;
                } else {
                    // 限制範圍
                    const imgW = img.offsetWidth;
                    const imgH = img.offsetHeight;
                    const containerW = viewer.clientWidth;
                    const containerH = viewer.clientHeight;
                    const scaledW = imgW * s.scale;
                    const scaledH = imgH * s.scale;
                    const maxTx = scaledW > containerW ? (scaledW - containerW) / 2 : 0;
                    const maxTy = scaledH > containerH ? (scaledH - containerH) / 2 : 0;
                    s.translateX = Math.max(-maxTx, Math.min(maxTx, s.translateX));
                    s.translateY = Math.max(-maxTy, Math.min(maxTy, s.translateY));
                }
                // 套用到 slide 內所有圖層（日/夜景層需同步縮放拖曳）
                slides[index].querySelectorAll('img').forEach(layer => {
                    layer.style.transform = `translate(${s.translateX}px, ${s.translateY}px) scale(${s.scale})`;
                });
            }

            function resetSlideTransform(index) {
                slideStates[index] = { scale: 1, translateX: 0, translateY: 0 };
                slides[index].querySelectorAll('img').forEach(layer => {
                    layer.style.transform = 'translate(0px, 0px) scale(1)';
                });
            }

            // --- 拖曳 ---
            viewer.addEventListener('mousedown', (e) => {
                if (e.target.closest('.ext3d-arrow') || e.target.closest('.ext3d-dot') || e.target.closest('.ext3d-daynight')) return;
                isDragging = true;
                startX = e.clientX;
                startY = e.clientY;
                slides[currentIndex].classList.add('interacting'); // 暫停 Ken Burns
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const s = slideStates[currentIndex];
                s.translateX += e.clientX - startX;
                s.translateY += e.clientY - startY;
                startX = e.clientX;
                startY = e.clientY;
                updateSlideTransform(currentIndex);
            });

            window.addEventListener('mouseup', () => { isDragging = false; });

            // --- 滾輪縮放 ---
            viewer.addEventListener('wheel', (e) => {
                e.preventDefault();
                slides[currentIndex].classList.add('interacting'); // 暫停 Ken Burns
                const s = slideStates[currentIndex];
                const zoomIntensity = 0.1;
                const direction = e.deltaY < 0 ? 1 : -1;
                let newScale = s.scale * Math.exp(direction * zoomIntensity);
                if (newScale < MIN_SCALE) newScale = MIN_SCALE;
                if (newScale > MAX_SCALE) newScale = MAX_SCALE;

                const rect = viewer.getBoundingClientRect();
                const mouseX = e.clientX - rect.left - rect.width / 2;
                const mouseY = e.clientY - rect.top - rect.height / 2;
                const ratio = 1 - (newScale / s.scale);

                s.translateX += (mouseX - s.translateX) * ratio;
                s.translateY += (mouseY - s.translateY) * ratio;
                s.scale = newScale;
                updateSlideTransform(currentIndex);
            }, { passive: false });

            // --- 雙擊還原 ---
            viewer.addEventListener('dblclick', (e) => {
                if (e.target.closest('.ext3d-arrow') || e.target.closest('.ext3d-dot') || e.target.closest('.ext3d-daynight')) return;
                resetSlideTransform(currentIndex);
                // 還原後重新播放 Ken Burns
                const slide = slides[currentIndex];
                slide.classList.remove('interacting', 'active');
                void slide.offsetWidth;
                slide.classList.add('active');
            });

        })();
    </script>
    <script src="js/cursor-petals.js?v=1.0.3"></script>
    <script src="js/spa-router.js?v=1.0.2"></script>
    <!-- Asset Update Manager -->
    <script src="js/asset-update-manager.js"></script>
    <script src="js/pwa-register.js?v=1.0.2" defer></script>
</body>

</html>
